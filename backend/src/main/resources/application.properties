spring.application.name=ScholarHub

# Default DataSource: Embedded H2 database with persistent file storage and MySQL compatibility
# This allows the backend to run out-of-the-box without requiring an external MySQL server.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/scholarhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring Security Defaults
spring.security.user.name=sam
spring.security.user.password=$2a$10$Y03XMnUqwW9F8wkt5gmIb.hHVXXNhwrkTsZl4rr7qBJs7YotRC8Mi

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.java_project.ScholarHub=DEBUG

# Gmail Configuration (optional - fallback to console log if unconfigured)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server Port
server.port=8080
